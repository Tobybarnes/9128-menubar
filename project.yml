name: Radio9128
options:
  bundleIdPrefix: com.tobybarnes
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ALWAYS_SEARCH_USER_PATHS: NO
targets:
  Radio9128:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobybarnes.radio9128
        PRODUCT_NAME: "9128"
        PRODUCT_MODULE_NAME: Radio9128
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          ENABLE_TESTABILITY: NO
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      testTargets:
        - Radio9128Tests
  Radio9128Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Radio9128
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobybarnes.radio9128.tests
        PRODUCT_NAME: Radio9128Tests
        PRODUCT_MODULE_NAME: Radio9128Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/9128.app/Contents/MacOS/9128"
        BUNDLE_LOADER: "$(TEST_HOST)"
